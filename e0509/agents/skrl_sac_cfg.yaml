seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # Actor - outputs continuous actions
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  
  critic_1:  # Q-network 1
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
  
  critic_2:  # Q-network 2 (for double Q-learning)
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
  
  target_critic_1:  # Target Q-network 1 (for stable learning)
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
  
  target_critic_2:  # Target Q-network 2 (for stable learning)
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Replay buffer memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: 100000  # SAC uses replay buffer


# SAC agent configuration (field names are from SAC_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/sac.html
agent:
  class: SAC
  
  gradient_steps: 1  # Number of gradient steps per environment step
  batch_size: 256  # Mini-batch size for training
  
  discount_factor: 0.99  # Gamma
  polyak: 0.005  # Soft update coefficient (tau)
  
  actor_learning_rate: 3.0e-4  # Policy learning rate
  critic_learning_rate: 3.0e-4  # Q-network learning rate
  
  random_timesteps: 10000  # Random exploration steps at the beginning
  learning_starts: 10000  # Start training after this many steps
  
  learn_entropy: True  # Automatically tune entropy coefficient
  entropy_learning_rate: 3.0e-4
  initial_entropy_value: 0.2  # Initial alpha value
  
  state_preprocessor: None
  state_preprocessor_kwargs: null
  value_preprocessor: None
  value_preprocessor_kwargs: null
  
  rewards_shaper: None
  
  # Checkpointing
  experiment:
    directory: e0509_lift_sac
    experiment_name: ""
    write_interval: 500  # Save model every N timesteps
    checkpoint_interval: 5000


# Trainer configuration
# https://skrl.readthedocs.io/en/latest/api/trainers/basic.html
trainer:
  class: SequentialTrainer
  
  timesteps: 50000  # Total training timesteps
  environment_info: episode
